version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: deeptrace_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deeptrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeptrace_password}
      POSTGRES_DB: ${POSTGRES_DB:-deeptrace_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
