name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier web service from sleeping (15-min inactivity threshold)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ResearchGPT Render Backend Health Check
        run: |
          echo "Pinging backend at $(date)..."
          curl -s -f -m 60 "https://researchgpt-backend-ygh8.onrender.com/health" || echo "Backend wake-up ping initiated."
